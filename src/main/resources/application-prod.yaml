spring:
  jpa:
    show-sql: false

  # Credenciais só do ambiente — nenhum default aqui, mesma regra do JWT_SECRET.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        debug: false
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    root: INFO
    com.devlil0.tramposeditor: INFO

tramposeditor:
  notifications:
    # Produção exige SMTP e configuração explícita, validada na inicialização.
    transport: ${NOTIFICATIONS_TRANSPORT:smtp}
    from: ${NOTIFICATIONS_FROM:}
    base-url: ${FRONTEND_BASE_URL:}
