server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none

spring:
  application:
    name: TramposEditor

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tramposeditor}
    username: ${DB_USERNAME:tramposeditor}
    password: ${DB_PASSWORD:tramposeditor}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Mata o N+1 da vitrine (ESBOCO §7 item 7). Cada EditorProfile tem três
        # @ElementCollection (nicho, ferramenta, estilo) mais o user: listar 20 editores
        # disparava uma consulta por coleção por editor.
        #
        # Batch fetch e não @EntityGraph de propósito: fetch join de três coleções junto
        # com paginação faz o Hibernate trazer tudo e paginar em memória (HHH000104), e
        # ainda multiplica linhas em produto cartesiano. Batch agrupa em `in (...)` e
        # deixa a paginação acontecer no banco, onde ela tem que acontecer.
        default_batch_fetch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  threads:
    virtual:
      enabled: true

  # Foto de perfil. O teto aqui é a primeira barreira: sem ele, o arquivo inteiro é lido
  # pra memória antes de o AvatarService ter chance de recusar pelo tamanho.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # ---------------------------------------------------------------------------------
  # Login social (Google e GitHub) — configurado SÓ por variável de ambiente.
  #
  # Não há bloco `security.oauth2.client.registration` aqui de propósito: o Spring
  # valida os registros na subida e um `client-id` vazio derruba a aplicação inteira com
  # "Client id of registration 'google' must not be empty". Registro com valor vazio é
  # pior que registro ausente — sem nada declarado, a autoconfiguração simplesmente não
  # cria o repositório, o SecurityConfig não liga o oauth2Login, e sobe sem provedor.
  #
  # Pra ligar, exporte (o nome longo é o binding relaxado do Spring):
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_SCOPE=read:user,user:email
  #
  # Endpoints e escopos vêm do CommonOAuth2Provider quando o nome do registro é `google`
  # ou `github`. O escopo do GitHub é o único que precisa de override: o padrão dele é
  # só `read:user`, e sem `user:email` quem tem e-mail privado chega aqui sem e-mail —
  # e sem e-mail não dá pra aplicar a conta única do FUNDACAO §11.9.
  #
  # Callback a cadastrar no console de cada provedor:
  #   http://localhost:8080/login/oauth2/code/google
  #   http://localhost:8080/login/oauth2/code/github
  # ---------------------------------------------------------------------------------

logging:
  level:
    # A API registra falhas de integridade sem imprimir a mensagem do driver.
    org.hibernate.orm.jdbc.error: "OFF"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

tramposeditor:
  auth-limits:
    max-entries: 10000
    trusted-proxies: []
    login:
      per-account: 8
      per-origin: 80
      window: 5m
      cooldown: 0s
    signup:
      per-account: 5
      per-origin: 60
      window: 10m
      cooldown: 60s
    password-reset:
      per-account: 5
      per-origin: 30
      window: 15m
      cooldown: 60s
    password-change:
      per-account: 5
      per-origin: 30
      window: 15m
      cooldown: 0s
  notifications:
    # `log` simula o envio e registra apenas metadados operacionais; `smtp` envia.
    transport: ${NOTIFICATIONS_TRANSPORT:log}
    from: ${NOTIFICATIONS_FROM:TramposEditor <nao-responda@tramposeditor.com>}
    # Raiz do frontend: todo link de e-mail leva a uma tela, não a um JSON.
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  security:
    jwt:
      # Sem default de propósito: em prod a aplicação DEVE falhar se JWT_SECRET não vier do ambiente.
      secret: ${JWT_SECRET:}
      ttl: ${JWT_TTL:PT12H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
