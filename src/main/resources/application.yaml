server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: TramposEditor

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tramposeditor}
    username: ${DB_USERNAME:tramposeditor}
    password: ${DB_PASSWORD:tramposeditor}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

tramposeditor:
  security:
    jwt:
      # Sem default de propósito: em prod a aplicação DEVE falhar se JWT_SECRET não vier do ambiente.
      secret: ${JWT_SECRET:}
      ttl: ${JWT_TTL:PT12H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
