# Produção na VPS (KingHost / Hostinger).
#   docker compose -f docker-compose.prod.yml up -d --build
# Variáveis vêm do arquivo .env ao lado deste (ver .env.example).
services:
  postgres:
    image: postgres:16-alpine
    container_name: tramposeditor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sem "ports": o banco só existe na rede interna do compose.
    # Nunca exponha 5432 na internet — é varrido por bots em minutos.

  app:
    build: .
    container_name: tramposeditor_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-PT12H}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      # Só no loopback: quem fala com a internet é o Nginx (TLS/Let's Encrypt),
      # que faz proxy_pass pra 127.0.0.1:8080.
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
